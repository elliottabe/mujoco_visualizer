[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mujoco_visualizer"
version = "0.1.0"
description = "Generic, config-driven offscreen visualizer for any MuJoCo model"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Elliott Abe"}]
dependencies = [
    "mujoco>=3.0",
    "numpy",
    "PyYAML",
]

[project.optional-dependencies]
io = ["mediapy", "imageio", "Pillow"]
gui = ["dearpygui"]
jupyter = ["ipywidgets", "mediapy", "ipython"]
serve = ["flask>=2.2", "flask-sock>=0.7", "simplejpeg>=1.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mujoco_visualizer = ["settings/*.json", "presets/fly/*.yaml", "presets/fly/*.py", "serve/static/*"]

[tool.pytest.ini_options]
markers = [
    "gl: requires a working headless OpenGL context (MUJOCO_GL=egl PYOPENGL_PLATFORM=egl)",
]
